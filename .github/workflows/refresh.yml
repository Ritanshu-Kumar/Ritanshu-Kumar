name: Refresh profile graphics

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: python -m pip install --quiet Pillow

      - name: Generate analytics PNGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/generate_stats.py

      - name: Update README cache keys
        env:
          CACHE: ${{ github.run_id }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          cache = os.environ["CACHE"]

          text = re.sub(
              r"assets/stats\.png\?v=[^\"')]+",
              f"assets/stats.png?v={cache}",
              text,
          )

          text = re.sub(
              r"assets/year\.png\?v=[^\"')]+",
              f"assets/year.png?v={cache}",
              text,
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain -- README.md assets/stats.png assets/year.png)" ]; then
            echo "No analytics changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md assets/stats.png assets/year.png
          git commit -m "chore: refresh profile analytics"
          git push
